# Nuget Lua
name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        toolConfig:
        - {
            runner: windows-2022,
            toolset: v141,
            winTarget: '10.0.26100.0',
            vs2022addMod: 'Microsoft.VisualStudio.Component.VC.v141.x86.x64'
          }
        - {
            runner: windows-2025,
            toolset: v142,
            winTarget: '10.0',
            # Already available on runner
            # vs2022addMod: 'Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64'
          }
        - {
            runner: windows-2025,
            toolset: v143,
            winTarget: '10.0',
            # Already available on runner
            # vs2022addMod: ''
          }
        - {
            runner: windows-2025,
            toolset: v145,
            winTarget: '10.0',
            # Already available on runner
            # vs2022addMod: ''
          }
        - {
            runner: windows-2025,
            toolset: ClangCL,
            winTarget: '10.0',
            # Already available on runner
            # vs2022addMod: ''
          }
    runs-on: ${{matrix.toolConfig.runner}}
    steps:

    - uses: actions/checkout@v7

    - name: Modify Visual Studio 2022
      if: matrix.toolConfig.vs2022addMod != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $component = "${{matrix.toolConfig.vs2022addMod}}"
        $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
        $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $configPath = Join-Path $env:RUNNER_TEMP "vs2022-post.vsconfig"
        $logPath = Join-Path $env:RUNNER_TEMP "vs-installer-logs"
        $startedAt = Get-Date
        New-Item -ItemType Directory -Path $logPath -Force | Out-Null
        Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
        Write-Host "Visual Studio installation: $installPath"
        if (-not (Test-Path $installer)) {
          throw "Visual Studio Installer not found at $installer"
        }
        if (-not (Test-Path $installPath)) {
          throw "Visual Studio 2022 not found at $installPath"
        }

        function Invoke-VSInstaller {
          param([string[]] $Arguments)

          Write-Host "$installer $($Arguments -join ' ')"
          $process = Start-Process -FilePath $installer -ArgumentList $Arguments -PassThru -Wait
          Write-Host "Visual Studio Installer exit code: $($process.ExitCode)"
          if ($process.ExitCode -notin 0, 3010) {
            throw "Visual Studio Installer failed with exit code $($process.ExitCode)"
          }
        }

        try {
          Write-Host "Adding: $component"
          Invoke-VSInstaller @(
            "modify",
            "--add", $component,
            "--installPath", "`"$installPath`"",
            "--passive",
            "--includeRecommended",
            "--norestart",
            "--noUpdateInstaller"
          )

          Invoke-VSInstaller @(
            "export",
            "--config", "`"$configPath`"",
            "--installPath", "`"$installPath`"",
            "--passive",
            "--noUpdateInstaller"
          )

          Write-Host "VS2022 Components after modification:"
          Get-Content $configPath

          Write-Host "Added:"
          $installedComponent = Get-Content $configPath | Select-String $component -SimpleMatch
          if (-not $installedComponent) {
            throw "Component $component was not present in the exported Visual Studio configuration"
          }
          $installedComponent
        }
        finally {
          $tempPaths = @($env:TEMP, "$env:SystemRoot\Temp") |
            Select-Object -Unique |
            Where-Object { Test-Path $_ }
          $logs = Get-ChildItem $tempPaths -File -Filter "dd_*" |
            Where-Object LastWriteTime -ge $startedAt |
            Sort-Object LastWriteTime
          foreach ($log in $logs) {
            Copy-Item $log.FullName $logPath
            Write-Host "::group::$($log.Name)"
            Get-Content $log.FullName -Tail 200
            Write-Host "::endgroup::"
          }
          if (-not $logs) {
            Write-Warning "No Visual Studio Installer logs were created in $($tempPaths -join ', ')"
          }
        }

    - name: Upload Visual Studio Installer logs
      if: always() && matrix.toolConfig.vs2022addMod != ''
      uses: actions/upload-artifact@v7
      with:
        name: vs-installer-logs-${{matrix.toolConfig.toolset}}
        path: ${{runner.temp}}\vs-installer-logs
        if-no-files-found: warn
        retention-days: 7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Patch VSProj toolset
      shell: pwsh
      run: |
        gci -r '*.vcxproj' | foreach {
          $proj = [xml](Get-Content $_)
          [System.Xml.XmlNamespaceManager]$ns = $proj.NameTable
          $ns.AddNamespace("Any", $proj.DocumentElement.NamespaceURI)
          $proj.SelectNodes("//Any:PlatformToolset", $ns) | foreach { $_.InnerText = '${{matrix.toolConfig.toolset}}' }
          $proj.SelectNodes("//Any:WindowsTargetPlatformVersion", $ns) | foreach { $_.InnerText = '${{matrix.toolConfig.winTarget}}' }
          $proj.save($_)
        }

    # Add additional options to the MSBuild command line here (like platform or verbosity level).
    # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
    - name: Build x64 Release
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 .
    - name: Build x64 Debug
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Debug /p:Platform=x64 .
    - name: Build x86 Release
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Release /p:Platform=x86 .
    - name: Build x86 Debug
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=Debug /p:Platform=x86 .

    - name: Run TestBuild
      shell: pwsh
      working-directory: ./testbuild
      run: |
        $tests = (gci -recurse -path ..\bin -include TestBuild.exe)
        if ($tests.Length -ne 4)
        {
          Write-Error "TestBuild.exe not found"
          exit 1
        }
        $tests | foreach { & $_ }

    - uses: actions/upload-artifact@v7
      with:
        name: lua-bin-${{matrix.toolConfig.toolset}}
        path: bin
        retention-days: 1
        if-no-files-found: error

  package:
    needs: build
    runs-on: windows-2025
    steps:

    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: lua-bin-v141
        path: bin
    - uses: actions/download-artifact@v8
      with:
        name: lua-bin-v142
        path: bin
    - uses: actions/download-artifact@v8
      with:
        name: lua-bin-v143
        path: bin
    - uses: actions/download-artifact@v8
      with:
        name: lua-bin-v145
        path: bin
    - uses: actions/download-artifact@v8
      with:
        name: lua-bin-ClangCL
        path: bin

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build NuGet Package
      shell: pwsh
      run: |
        $packageVersion = 0
        .\makeNuget.ps1 $packageVersion

    - name: Prepare TestNuget
      working-directory: ./testnuget
      shell: pwsh
      run: |
        .\prepareProject.ps1
        nuget restore

    - name: Build TestNuget x64 Release
      working-directory: ./testnuget
      run: msbuild /m /p:Configuration=Release /p:Platform=x64 .
    - name: Build TestNuget x64 Debug
      working-directory: ./testnuget
      run: msbuild /m /p:Configuration=Debug /p:Platform=x64 .
    - name: Build TestNuget x86 Release
      working-directory: ./testnuget
      run: msbuild /m /p:Configuration=Release /p:Platform=x86 .
    - name: Build TestNuget x86 Debug
      working-directory: ./testnuget
      run: msbuild /m /p:Configuration=Debug /p:Platform=x86 .

    - name: Run TestNuget
      shell: pwsh
      working-directory: ./testnuget
      run: |
        $tests = (gci -recurse -path . -include TestNuget.exe)
        if ($tests.Length -ne 4)
        {
          Write-Error "TestNuget.exe not found"
          exit 1
        }
        $tests | foreach { & $_ }

    - uses: actions/upload-artifact@v7
      with:
        name: lua-nuget
        path: lua.*.nupkg
        if-no-files-found: error
        retention-days: 7
